<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carandang Rodillo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <h2>My To-Do List</h2>

        <form id="taskForm">
            <input type="text" id="taskInput" placeholder="Enter task" required>
            <select id="prioritySelect">
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>
            <button type="submit" id="addBtn">Add</button>
        </form>
        <h4>Filters</h4>
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
            <button class="filter-btn" data-filter="high">High Priority</button>
            <button class="filter-btn" data-filter="medium">Medium Priority</button>
            <button class="filter-btn" data-filter="low">Low Priority</button>
        </div>
         <h5>My Tasks</h5>
        <ul id="taskList"></ul>
          
    </div>
    <script src="script.js"></script>
</body>
</html>
